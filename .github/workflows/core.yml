name: Public CPU acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.lock
      - run: python -m pip install -r requirements-core.lock
      - run: python -m scripts.check_core
      - run: node --check lowalt_platform/web/platform.js
      - run: python -m scripts.reproduce_import --output runs/public-import
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-import-evidence-python-${{ matrix.python-version }}
          path: |
            runs/public-import/evidence.zip
            runs/public-import/assets.geojson
            runs/public-import/verification.json
          if-no-files-found: error
