<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>金标人工审核</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202934;font:14px "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;min-height:72px;padding:12px 24px;background:#fff;border-bottom:1px solid #d9dee5}.brand{min-width:190px}.brand h1{margin:0;font-size:19px}.brand small{color:#687483}.progress{flex:1;min-width:180px}.progress-line{display:flex;justify-content:space-between;margin-bottom:6px;color:#53606f;font-size:12px}.track{height:7px;background:#e6e9ed}.fill{height:100%;width:0;background:#168463;transition:width .2s}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary b{font-size:15px}.summary span{color:#667281;font-size:11px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:calc(100vh - 72px)}.queue{border-right:1px solid #d9dee5;background:#fff;overflow:auto;max-height:calc(100vh - 72px);position:sticky;top:72px}.queue-tools{padding:12px;border-bottom:1px solid #e1e5ea}.queue-tools select{width:100%;padding:8px;border:1px solid #cbd2da;background:#fff}.queue-list{margin:0;padding:0;list-style:none}.queue-list button{display:grid;grid-template-columns:32px 1fr 9px;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #eef0f3;background:#fff;text-align:left}.queue-list button:hover,.queue-list button.active{background:#edf5f2}.queue-list .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#aab2bc}.dot.approved{background:#168463}.dot.needs_correction{background:#c43d4d}.dot.corrected{background:#3475b9}.viewer{min-width:0;padding:16px 18px 28px}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.viewer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:6px;align-items:center}.tools button,.mode button,.nav button{min-width:36px;height:34px;border:1px solid #cbd2da;background:#fff}.mode{display:flex}.mode button.active{background:#263645;color:#fff;border-color:#263645}.canvas{height:calc(100vh - 168px);min-height:420px;overflow:auto;background:#171b20;display:grid;place-items:center}.canvas img{display:block;max-width:100%;max-height:100%;transform-origin:center;transition:transform .12s}.review{border-left:1px solid #d9dee5;background:#fff;padding:18px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.review h2{margin:0 0 16px;font-size:16px}.checklist{padding:0;margin:0 0 18px;list-style:none;border-top:1px solid #e1e5ea}.checklist li{padding:10px 0;border-bottom:1px solid #e1e5ea}.checklist b{display:block;font-size:13px}.checklist span{color:#687483;font-size:11px}.field{display:block;margin:14px 0 0;color:#53606f;font-size:12px}.field input,.field textarea{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #c8d0d9;background:#fff}.field textarea{min-height:92px;resize:vertical}.decisions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.decisions button{padding:10px;border:1px solid #c7cfd8;background:#fff}.decisions .approve{background:#168463;border-color:#168463;color:#fff}.decisions .issue{background:#fff2f3;border-color:#d17b85;color:#a12838}.decisions .corrected{background:#eaf3fb;border-color:#75a3cc;color:#245f94}.decisions .pending{color:#596675}.message{min-height:22px;margin-top:10px;font-size:12px;color:#168463}.message.bad{color:#b3293b}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.nav button{width:100%}.keyboard{margin-top:16px;color:#818b98;font-size:11px}@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr) 300px}}@media(max-width:800px){.topbar{position:static;align-items:flex-start;flex-direction:column}.layout{display:block}.queue{position:static;max-height:180px;border-right:0;border-bottom:1px solid #d9dee5}.viewer{padding:12px}.canvas{height:55vh;min-height:320px}.review{position:static;height:auto;border-left:0;border-top:1px solid #d9dee5}.summary{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>金标人工审核</h1><small id="package">加载中</small></div>
    <div class="progress"><div class="progress-line"><span id="progressText">0 / 0</span><span id="gate">门禁待审核</span></div><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="summary"><div><b id="approvedCount">0</b><br><span>通过</span></div><div><b id="issueCount">0</b><br><span>有问题</span></div><div><b id="pendingCount">0</b><br><span>待审核</span></div></div>
  </header>
  <div id="invalidSource" hidden style="padding:14px 24px;background:#fff0f1;border-bottom:1px solid #d98b94;color:#8e2532;font-weight:700">该批数据已停止审核：源数据的旋转车位标注被转换成水平框，再机械展开成 OBB，斜视车位框明显失真。本页面仅保留查看，不能提交通过。<a href="/space-classifier-shadow" style="margin-left:12px;color:#174f83">查看当前固定车位分类结果</a></div>
  <main class="layout">
    <aside class="queue"><div class="queue-tools"><select id="filter" aria-label="审核状态筛选"><option value="all">全部状态</option><option value="pending">待审核</option><option value="needs_correction">有问题</option><option value="approved">已通过</option><option value="corrected">已修正</option></select></div><ol class="queue-list" id="queue"></ol></aside>
    <section class="viewer">
      <div class="viewer-head"><strong id="imageName"></strong><div class="tools"><div class="mode"><button id="previewMode" class="active" title="标注预览">标注</button><button id="rawMode" title="原始图片">原图</button></div><button id="zoomOut" title="缩小">−</button><button id="zoomReset" title="重置缩放">1:1</button><button id="zoomIn" title="放大">+</button></div></div>
      <div class="canvas" id="canvas"><img id="reviewImage" alt="当前审核图片"></div>
    </section>
    <aside class="review">
      <h2 id="position">0 / 0</h2>
      <ul class="checklist"><li><b>业务车位完整</b><span>无漏标、无业务范围外标注</span></li><li><b>一位一框</b><span>无重复框、无跨相邻车位</span></li><li><b>几何边界正确</b><span>框贴合固定车位，不框道路或整车</span></li><li><b>空占类别正确</b><span>occupied 有车，empty 空位</span></li></ul>
      <label class="field">问题或修正说明<textarea id="notes" maxlength="2000" placeholder="标记有问题或已修正时必填"></textarea></label>
      <div class="decisions"><button class="approve" data-status="approved">通过</button><button class="issue" data-status="needs_correction">有问题</button><button class="corrected" data-status="corrected">已修正</button><button class="pending" data-status="pending">撤回待审</button></div>
      <div class="message" id="message"></div>
      <div class="nav"><button id="previous">上一张</button><button id="next">下一张</button></div>
      <div class="keyboard">快捷键：A 通过 · X 有问题 · ←/→ 切换 · +/- 缩放</div>
    </aside>
  </main>
  <script>
    const $=id=>document.getElementById(id);let rows=[],current=0,zoom=1,mode='preview',busy=false;
    const statusClass=s=>['approved','needs_correction','corrected'].includes(s)?s:'pending';
    function asset(row,kind){const stem=row.image.replace(/\.[^.]+$/,'');const file=kind==='raw'?row.image:stem+'.jpg';const folder=kind==='raw'?'images':'previews';return '/golden-review/'+folder+'/'+encodeURIComponent(file)}
    function visible(){const f=$('filter').value;return rows.map((row,index)=>({row,index})).filter(x=>f==='all'||statusClass(x.row.review_status)===f)}
    function renderQueue(){const list=visible();$('queue').replaceChildren(...list.map(({row,index})=>{const b=document.createElement('button');b.type='button';b.className=index===current?'active':'';b.innerHTML='<span>'+(index+1)+'</span><span class="name"></span><i class="dot '+statusClass(row.review_status)+'"></i>';b.querySelector('.name').textContent=row.image;b.onclick=()=>show(index);const li=document.createElement('li');li.appendChild(b);return li}));}
    function updateSummary(){const counts={pending:0,approved:0,needs_correction:0,corrected:0};rows.forEach(r=>counts[statusClass(r.review_status)]++);const done=counts.approved+counts.corrected,total=rows.length;$('progressText').textContent=`已完成 ${done} / ${total}`;$('fill').style.width=(total?done/total*100:0)+'%';$('approvedCount').textContent=counts.approved+counts.corrected;$('issueCount').textContent=counts.needs_correction;$('pendingCount').textContent=counts.pending;$('gate').textContent=done===total&&counts.needs_correction===0?'逐图审核完成，待独立批准':'门禁待审核';}
    function show(index){if(!rows.length)return;current=Math.max(0,Math.min(rows.length-1,index));const row=rows[current];$('imageName').textContent=row.image;$('position').textContent=`${current+1} / ${rows.length} · ${row.objects} 个标注`;$('notes').value=row.notes||'';$('reviewImage').src=asset(row,mode);$('message').textContent='';zoom=1;applyZoom();renderQueue();document.querySelector('.queue button.active')?.scrollIntoView({block:'nearest'});}
    function applyZoom(){$('reviewImage').style.transform=`scale(${zoom})`;}
    function move(step){show(current+step)}
    function nextPending(){for(let offset=1;offset<=rows.length;offset++){const i=(current+offset)%rows.length;if(statusClass(rows[i].review_status)==='pending'||statusClass(rows[i].review_status)==='needs_correction'){show(i);return}}move(1)}
    async function save(status){if(window.sourceInvalid){fail('该批源标注已判定不可用，审核提交已停止');return}if(busy)return;const notes=$('notes').value.trim();if((status==='needs_correction'||status==='corrected')&&!notes){fail('请填写具体问题或修正说明');return}busy=true;$('message').className='message';$('message').textContent='保存中';try{const response=await fetch('/api/golden-review/'+current,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_status:status,notes})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'保存失败');rows[current]=data.row;updateSummary();renderQueue();$('message').textContent='已保存';if(status==='approved'||status==='corrected')setTimeout(nextPending,220)}catch(error){fail(error.message)}finally{busy=false}}
    function fail(text){$('message').className='message bad';$('message').textContent=text}
    function setMode(next){mode=next;$('previewMode').classList.toggle('active',mode==='preview');$('rawMode').classList.toggle('active',mode==='raw');if(rows[current])$('reviewImage').src=asset(rows[current],mode)}
    async function load(){const [response,qualityResponse]=await Promise.all([fetch('/api/golden-review'),fetch('/api/report/quality')]);const data=await response.json(),quality=await qualityResponse.json();if(!response.ok)throw new Error(data.detail||'加载失败');rows=data.rows||[];$('package').textContent=data.package||'审核包';const codes=(quality.errors||[]).map(x=>x.code);window.sourceInvalid=codes.includes('AABB_TO_OBB_INVALID')||codes.includes('SOURCE_DATA_NOT_GOLDEN');if(window.sourceInvalid){$('invalidSource').hidden=false;document.querySelectorAll('[data-status]').forEach(button=>button.disabled=true)}updateSummary();const first=Math.max(0,rows.findIndex(r=>statusClass(r.review_status)==='pending'));show(first)}
    document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>save(b.dataset.status));$('filter').onchange=renderQueue;$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('previewMode').onclick=()=>setMode('preview');$('rawMode').onclick=()=>setMode('raw');$('zoomIn').onclick=()=>{zoom=Math.min(3,zoom+.25);applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom-.25);applyZoom()};$('zoomReset').onclick=()=>{zoom=1;applyZoom()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key.toLowerCase()==='a')save('approved');else if(e.key.toLowerCase()==='x')save('needs_correction');else if(e.key==='+')$('zoomIn').click();else if(e.key==='-')$('zoomOut').click()});load().catch(e=>fail(e.message));
  </script>
</body>
</html>
