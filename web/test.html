<script>
let MODELS=[],DEFAULT_BASELINE=null,DEFAULT_LATEST=null,SELECTED_MODEL='';
let QUALITY_OK=false;
const metricLabels={precision:'Precision',recall:'Recall',mAP50:'mAP50','mAP50-95':'mAP50-95'};
function shortDate(v){return v?new Date(v).toLocaleString('zh-CN'):'—'}
function fileName(path){return String(path||'').split(/[\\/]/).pop()||'—'}
function modelRole(m){return m.role==='current'?'当前主模型':m.role==='reference'?'预训练参考（不可验收）':m.role==='backup'?'历史主模型':m.display_name||m.run_name||'实验模型'}
function setDefaultCards(){
  const ready=DEFAULT_BASELINE&&DEFAULT_LATEST;$('#defaultState').textContent=QUALITY_OK?(ready?'验收条件已就绪':'缺少可比较模型'):'等待数据整改';$('#defaultCompareBtn').disabled=!ready||!QUALITY_OK;
  if(DEFAULT_BASELINE){$('#baselineName').textContent=DEFAULT_BASELINE.name;$('#baselineTime').textContent=shortDate(DEFAULT_BASELINE.modified_at);$('#baselineSize').textContent=DEFAULT_BASELINE.size_mb+' MB'}
  if(DEFAULT_LATEST){$('#latestName').textContent=DEFAULT_LATEST.name;$('#latestTime').textContent=shortDate(DEFAULT_LATEST.modified_at);$('#latestSize').textContent=DEFAULT_LATEST.size_mb+' MB'}
}
function showModelPath(model){const box=$('#modelLocation');clear(box);box.style.display='flex';box.appendChild(el('code',{text:model.path}));box.appendChild(el('button',{text:'复制路径',onclick:async()=>{try{await navigator.clipboard.writeText(model.path);toast('模型路径已复制')}catch(e){toast('复制失败','err')}}}))}
async function loadModels(){
  const d=await apiGet('/api/test/models');MODELS=d.models||[];DEFAULT_BASELINE=d.default_comparison?.baseline||null;DEFAULT_LATEST=d.default_comparison?.latest||null;setDefaultCards();
  const list=$('#modelList');clear(list);MODELS.forEach((m,i)=>{const radio=el('input',{type:'radio',name:'model',class:'inline',style:'width:auto',...(i===0?{checked:'checked'}:{})});radio.addEventListener('change',()=>{SELECTED_MODEL=m.path;showModelPath(m)});list.appendChild(el('div',{class:'model-row'},[radio,el('div',{},[el('div',{class:'model-title'},[el('span',{text:modelRole(m)}),el('span',{class:'model-badge '+m.role,text:m.role==='current'?'CURRENT':m.role==='reference'?'REFERENCE':m.role==='backup'?'HISTORY':'RUN'})]),el('div',{class:'model-sub',text:`${m.name} · ${shortDate(m.modified_at)}`})]),el('span',{class:'model-size',text:m.size_mb+' MB'})]));if(i===0){SELECTED_MODEL=m.path;showModelPath(m)}});
  const baseline=$('#compareBaseline'),trained=$('#compareTrained'),comparable=MODELS.filter(m=>m.role!=='reference');clear(baseline);clear(trained);comparable.forEach(m=>{const label=`${modelRole(m)} · ${m.name}`;baseline.appendChild(el('option',{value:m.path,text:label}));trained.appendChild(el('option',{value:m.path,text:label}))});if(DEFAULT_BASELINE)baseline.value=DEFAULT_BASELINE.path;if(DEFAULT_LATEST)trained.value=DEFAULT_LATEST.path;
}
async function runDefaultCompare(){if(!QUALITY_OK){toast('数据质量未通过，暂不能运行验收对比','err');return}if(!DEFAULT_BASELINE||!DEFAULT_LATEST){toast('缺少默认模型','err');return}await startJob('p3_compare',{baseline:DEFAULT_BASELINE.path,trained:DEFAULT_LATEST.path,split:$('#defaultSplit').value})}
async function runCustomCompare(){const baseline=$('#compareBaseline').value,trained=$('#compareTrained').value;if(!baseline||!trained||baseline===trained){toast('请选择两个不同模型','err');return}await startJob('p3_compare',{baseline,trained,split:$('#defaultSplit').value,imgsz:$('#imgsz').value||''})}
async function runPredict(){const source=$('#source').value.trim();if(!source){toast('请输入图片或目录','err');return}await startJob('p3_predict',{model:SELECTED_MODEL,source,conf:$('#conf').value||'0.25',imgsz:$('#imgsz').value||''})}
function renderVerdict(cmp){
  const root=$('#compareResult');clear(root);const key='mAP50-95',delta=Number(cmp.delta?.[key]||0),percent=delta*100,kind=delta>.0005?'up':delta<-.0005?'down':'flat';const title=kind==='up'?'最新模型综合精度提升':kind==='down'?'最新模型综合精度下降':'两个模型效果基本持平';
  root.appendChild(el('div',{class:'verdict '+(kind==='up'?'':kind)},[el('div',{},[el('strong',{text:title}),el('span',{text:`${String(cmp.split||'test').toUpperCase()} 数据集 · ${fileName(cmp.baseline_model)} 对比 ${fileName(cmp.trained_model)}`})]),el('div',{class:'verdict-score'},[el('b',{text:`${percent>0?'+':''}${percent.toFixed(2)} 分`}),el('small',{text:'严格综合能力提升'})])]));
  const latest=cmp.trained||{},base=cmp.baseline||{};
  const precision=Math.round(Number(latest.precision||0)*100),recall=Math.round(Number(latest.recall||0)*100),overall=Number(latest['mAP50-95']||0)*100,oldOverall=Number(base['mAP50-95']||0)*100;
  const deployTitle=kind==='up'?'建议使用最新模型':'暂不建议替换当前模型';
  const ability=recall>=85?'可承担自动识别主流程':recall>=65?'适合自动初筛与辅助标注':'适合试用验证，仍需加强训练';
