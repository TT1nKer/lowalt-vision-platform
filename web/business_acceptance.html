<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务人工验收</title>
<style>body{margin:0;background:#f4f6f9;color:#243047;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{padding:18px 3vw;background:#fff;border-bottom:1px solid #dce2ea;position:sticky;top:0;z-index:2}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:20px}.status{font-weight:700;color:#a06b00}.metrics{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;color:#5e6b80}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 3vw 28px}.viewer,.form{background:#fff;border:1px solid #dce2ea;border-radius:8px}.viewer{padding:12px}.viewer img{display:block;width:100%;background:#161b24}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.nav button,.save{border:1px solid #ccd5e1;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}.form{padding:16px;position:sticky;top:116px;height:max-content}.form h2{margin:0 0 14px;font-size:15px}.group{padding:12px 0;border-top:1px solid #e7ebf1}.group h3{margin:0 0 9px;font-size:13px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;color:#69768a;font-size:11px}input,textarea{box-sizing:border-box;width:100%;margin-top:5px;border:1px solid #ced6e1;border-radius:5px;padding:8px;font:inherit}textarea{min-height:76px;resize:vertical}.save{width:100%;margin-top:12px;background:#2864dc;border-color:#2864dc;color:#fff;font-weight:700}.hint{font-size:11px;color:#7a8799;line-height:1.5}.msg{min-height:20px;margin-top:9px;color:#167652}.bad{color:#bd3d4c}@media(max-width:850px){.layout{grid-template-columns:1fr}.form{position:static}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><div class="top"><div><h1>恢复路径 1：业务人工验收</h1><div class="hint">左侧为旧模型和候选模型同图结果。请按实际目标逐项填写，不要根据模型置信度推测。</div></div><div class="status" id="status">加载中</div></div><div class="metrics" id="metrics"></div></header>
<main class="layout"><section class="viewer"><div class="nav"><button onclick="move(-1)">上一张</button><strong id="position"></strong><button onclick="move(1)">下一张</button></div><img id="image" alt="模型同图对比"></section><aside class="form"><h2 id="name"></h2>
<div class="group"><h3>候选模型：occupied</h3><div class="fields"><label>TP<input id="occupied_tp" type="number" min="0"></label><label>FP<input id="occupied_fp" type="number" min="0"></label><label>FN<input id="occupied_fn" type="number" min="0"></label></div></div>
<div class="group"><h3>候选模型：empty</h3><div class="fields"><label>TP<input id="empty_tp" type="number" min="0"></label><label>FP<input id="empty_fp" type="number" min="0"></label><label>FN<input id="empty_fn" type="number" min="0"></label></div></div>
<div class="group" id="gemma"><h3>Gemma 机器预审</h3><p class="hint" id="gemmaText">等待机器预审</p></div><div class="group"><label>严重误检数量<input id="critical_fp" type="number" min="0"></label><p class="hint">严重误检：会直接触发错误业务动作或安全风险的误检。</p><label>复核人<input id="reviewer" maxlength="100"></label><label>备注<textarea id="notes" maxlength="2000"></textarea></label></div>
<button class="save" onclick="save()">保存本张并进入下一张</button><div class="msg" id="msg"></div></aside></main>
<script>const numeric=['occupied_tp','occupied_fp','occupied_fn','empty_tp','empty_fp','empty_fn','critical_fp'];let rows=[],index=0;
let gemma={};async function load(){const [r,shadow]=await Promise.all([fetch('/api/business-acceptance'),fetch('/api/report/business-shadow')]);const d=await r.json(),s=await shadow.json();rows=d.rows||[];gemma=d.gemma_pre_review||{};renderSummary(d.validation,s);show(0)}
function renderSummary(v,s={}){document.getElementById('status').textContent=`已完成 ${v.reviewed||0}/30 · 发布状态：${s.release_status||'blocked'}`;const f=n=>Number(n||0).toFixed(3);const blockers=(s.blockers||[]).join('；');document.getElementById('metrics').textContent=`occupied P ${f(v.metrics?.occupied?.precision)} / R ${f(v.metrics?.occupied?.recall)}　 empty P ${f(v.metrics?.empty?.precision)} / R ${f(v.metrics?.empty?.recall)}　严重误检率 ${f(v.critical_fp_rate)}${blockers?'　阻塞：'+blockers:''}`}
function show(i){if(!rows.length)return;index=Math.max(0,Math.min(rows.length-1,i));const r=rows[index],g=gemma[r.image];document.getElementById('position').textContent=`${index+1} / ${rows.length}`;document.getElementById('name').textContent=r.image+'（校准阈值 0.65）';document.getElementById('image').src='/business-shadow-calibrated/'+encodeURIComponent(r.comparison);numeric.concat(['reviewer','notes']).forEach(k=>document.getElementById(k).value=r[k]||'');document.getElementById('gemmaText').textContent=g?`原始 0.25 阈值的 Gemma 预审：${g.verdict}，置信度 ${g.confidence}。此建议不能代表校准后结果，需以当前图片人工判断。${g.evidence||''}`:'Gemma 预审仍在进行或该图未返回结果。';document.getElementById('msg').textContent=''}
function move(n){show(index+n)}
async function save(){const body={};numeric.concat(['reviewer','notes']).forEach(k=>body[k]=document.getElementById(k).value);const res=await fetch('/api/business-acceptance/'+index,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await res.json();const msg=document.getElementById('msg');if(!res.ok){msg.className='msg bad';msg.textContent=d.detail||'保存失败';return}rows[index]=d.row;renderSummary(d.validation);msg.className='msg';msg.textContent='已保存';if(index<rows.length-1)setTimeout(()=>show(index+1),350)}load().catch(e=>{document.getElementById('status').textContent='加载失败';document.getElementById('msg').textContent=e})</script></body></html>
